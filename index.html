    <script>
      const pageHistory = ['page-home'];
      let currentOverlayOpen = false;
      let loopInterval = null;

      const scentPages = [
        'page-3-scent1',
        'page-3-scent2',
        'page-3-scent3',
        'page-3-scent4',
      ];
      const spacePages = [
        'page-3-space1',
        'page-3-space2',
        'page-3-space3',
        'page-3-space4',
        'page-3-space5',
        'page-3-space6',
      ];

      document.querySelectorAll('.screen-page').forEach((page) => {
        const backBtn = document.createElement('div');
        backBtn.className = 'common-btn btn-back';
        backBtn.onclick = (e) => {
          e.stopPropagation();
          goBack();
        };

        const menuBtn = document.createElement('div');
        menuBtn.className = 'common-btn btn-menu';
        menuBtn.onclick = (e) => {
          e.stopPropagation();
          openMenu();
        };

        page.appendChild(backBtn);
        page.appendChild(menuBtn);
      });

      function toggleButton(el) {
        el.classList.toggle('selected');
      }

      function showPage(targetId) {
        const currentPageId = pageHistory[pageHistory.length - 1];
        if (currentPageId === targetId) return;

        closeMenu();

        if (scentPages.includes(targetId) || spacePages.includes(targetId)) {
          startLoop(targetId);
        } else {
          stopLoop();
        }

        const pages = document.querySelectorAll('.screen-page');
        pages.forEach((page) => page.classList.remove('active'));

        const targetEl = document.getElementById(targetId);
        if (targetEl) {
          targetEl.classList.add('active');
          pageHistory.push(targetId);
        }
      }

      function startLoop(currentId) {
        stopLoop();

        let targetList = scentPages.includes(currentId)
          ? scentPages
          : spacePages;
        let currentIndex = targetList.indexOf(currentId);
        if (currentIndex === -1) currentIndex = 0;

        loopInterval = setInterval(() => {
          currentIndex = (currentIndex + 1) % targetList.length;
          const nextId = targetList[currentIndex];

          const pages = document.querySelectorAll('.screen-page');
          pages.forEach((page) => page.classList.remove('active'));

          const nextEl = document.getElementById(nextId);
          if (nextEl) {
            nextEl.classList.add('active');
          }

          if (pageHistory[pageHistory.length - 1] !== nextId) {
            pageHistory.push(nextId);
          }
        }, 1000);
      }

      function stopLoop() {
        if (loopInterval) {
          clearInterval(loopInterval);
          loopInterval = null;
        }
      }

      function goBack() {
        if (currentOverlayOpen) {
          closeMenu();
          return;
        }

        if (pageHistory.length > 1) {
          pageHistory.pop();
          const previousPageId = pageHistory[pageHistory.length - 1];

          if (
            !scentPages.includes(previousPageId) &&
            !spacePages.includes(previousPageId)
          ) {
            stopLoop();
          } else {
            startLoop(previousPageId);
          }

          const pages = document.querySelectorAll('.screen-page');
          pages.forEach((page) => page.classList.remove('active'));

          const prevEl = document.getElementById(previousPageId);
          if (prevEl) {
            prevEl.classList.add('active');
          }
        }
      }

      function openMenu() {
        document.getElementById('menu-overlay').classList.add('active');
        currentOverlayOpen = true;
      }

      function closeMenu() {
        document.getElementById('menu-overlay').classList.remove('active');
        currentOverlayOpen = false;
      }
    </script>
